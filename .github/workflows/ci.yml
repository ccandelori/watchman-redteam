name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Run tests
        run: uv run --locked --extra dev pytest -q

      - name: Run campaign regression gate
        run: uv run --locked --extra dev pytest tests/test_campaign_regression_gate.py -q

      - name: Run ruff
        run: uv run --locked --extra dev ruff check .

      - name: Run mypy
        run: uv run --locked --extra dev mypy src tests

      - name: Build package
        run: uv build

      - name: Smoke installed wheel (imports + TUI)
        run: |
          python -m venv /tmp/aegis-redteam-smoke
          /tmp/aegis-redteam-smoke/bin/python -m pip install dist/*.whl
          /tmp/aegis-redteam-smoke/bin/aegis-redteam --help
          /tmp/aegis-redteam-smoke/bin/python -c "from aegis_redteam.tui.app import RedteamTUI; print(RedteamTUI.__name__)"

      - name: Smoke installed wheel against HTTP fixture
        run: bash scripts/installed_wheel_smoke.sh
